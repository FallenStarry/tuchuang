<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>登录</title></head>
<body>
  <h1>登录</h1>

  {% with messages = get_flashed_messages() %}
    {% if messages %}
      <ul>{% for msg in messages %}<li>{{ msg }}</li>{% endfor %}</ul>
    {% endif %}
  {% endwith %}

  <form method="POST">
    <input type="password" name="password" placeholder="密码"><br>
    <button type="submit">登录</button>
  </form>
</body>
</html>
